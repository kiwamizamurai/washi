[package]
name = "washi"
version = "0.1.0"
description = "Viewer and editor for Markdown, Typst, LaTeX and Mermaid"
authors = ["kiwamizamurai"]
edition = "2021"


[lib]
name = "washi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
washi-core = { path = "../crates/washi-core" }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-single-instance = "2.5.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder"] }
